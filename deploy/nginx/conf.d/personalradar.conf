server {
  listen 80;
  server_name www.personalradar.dev;

  return 301 https://personalradar.dev$request_uri;
}

server {
  listen 80 default_server;
  server_name personalradar.dev localhost 127.0.0.1;

  root /app/dist/ptr-frontend/browser;

  if ($ptr_scanner_request) {
    return 444;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ^~ /api/backend/auth/ {
    limit_req zone=ptr_auth burst=10 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass http://ptr_angular_ssr;
  }

  location ^~ /api/ {
    limit_req zone=ptr_api burst=40 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass http://ptr_angular_ssr;
  }

  location / {
    limit_conn ptr_per_ip 30;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass http://ptr_angular_ssr;
  }
}
