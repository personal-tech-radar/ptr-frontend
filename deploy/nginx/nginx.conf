user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format ptr_main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" request_time=$request_time';

  access_log /var/log/nginx/access.log ptr_main;

  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  set_real_ip_from 127.0.0.0/8;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;

  map $uri $ptr_scanner_request {
    default 0;
    ~*^/(?:wp-admin|wp-login\.php|wp-content|wp-includes|wordpress)(?:/|$) 1;
    ~*^/(?:xmlrpc\.php|wlwmanifest\.xml|phpmyadmin|pma|adminer)(?:/|$) 1;
    ~*^/(?:\.env|\.git|\.svn|vendor/phpunit|cgi-bin)(?:/|$) 1;
    ~*^/(?:boaform|HNAP1|actuator|server-status)(?:/|$) 1;
  }

  map $http_x_forwarded_proto $ptr_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  limit_req_zone $binary_remote_addr zone=ptr_api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=ptr_auth:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=ptr_per_ip:10m;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 2m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  include /etc/nginx/conf.d/*.conf;
}
