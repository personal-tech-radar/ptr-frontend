<nav aria-label="Signal dates">
  <button class="arrow" type="button" disabled aria-label="Previous dates">‹</button>
  <div class="days">
    @for (label of labels(); track label; let index = $index) {
      <button
        type="button"
        [attr.aria-disabled]="disabled()"
        [attr.aria-current]="index === active() ? 'date' : null"
        (click)="selected.emit(index)"
      >
        {{ label }}
      </button>
    }
  </div>
  <button class="arrow" type="button" disabled aria-label="Next dates">›</button>
</nav>
