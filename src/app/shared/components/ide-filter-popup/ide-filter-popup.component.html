<section class="popup" role="dialog" [attr.aria-label]="title()">
  <header>
    <span>{{ title() }}</span>
    <button type="button" aria-label="Close" (click)="close($event)">×</button>
  </header>
  @if (searchable()) {
    <div class="search">
      <input
        #searchInput
        type="search"
        aria-label="Search"
        placeholder="search..."
        [ngModel]="query()"
        (ngModelChange)="query.set($event); activeIndex.set(0)"
        (keydown.arrowDown)="$event.preventDefault(); move(1)"
        (keydown.arrowUp)="$event.preventDefault(); move(-1)"
        (keydown.enter)="$event.preventDefault(); chooseActive()"
      />
    </div>
  }
  <div class="options" role="listbox" [attr.aria-label]="title()">
    @for (option of filtered(); track option.id; let index = $index) {
      <button
        type="button"
        role="option"
        [class.active]="index === activeIndex()"
        [attr.aria-selected]="selectedIds().includes(option.id)"
        (mouseenter)="activeIndex.set(index)"
        (click)="toggled.emit(option.id)"
      >
        {{ selectedIds().includes(option.id) ? '[×]' : '[ ]' }} {{ option.name }}
      </button>
    } @empty {
      <p>No matches</p>
    }
  </div>
</section>
