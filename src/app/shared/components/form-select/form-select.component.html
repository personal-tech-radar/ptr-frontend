<div class="select">
  <span class="label">{{ label() }}</span>
  <button
    #trigger
    type="button"
    class="trigger"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open()"
    (click)="open.update((value) => !value)"
  >
    <span>{{ selectedLabel() }}</span
    ><span aria-hidden="true">▾</span>
  </button>
  @if (open()) {
    <button class="backdrop" type="button" aria-label="Close" (click)="close()"></button>
    <section class="popup">
      @if (searchable()) {
        <div class="search">
          <input
            type="search"
            aria-label="Search"
            placeholder="search..."
            [ngModel]="query()"
            (ngModelChange)="query.set($event)"
          />
        </div>
      }
      <div role="listbox" [attr.aria-label]="label()">
        @for (option of filtered(); track option.value) {
          <button
            type="button"
            role="option"
            [attr.aria-selected]="option.value === value()"
            (click)="select(option.value)"
          >
            {{ option.value === value() ? '[×]' : '[ ]' }} {{ option.label }}
          </button>
        }
      </div>
    </section>
  }
</div>
